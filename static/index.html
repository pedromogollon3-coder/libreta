<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libreta</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3V3z"/><path d="M5 18a3 3 0 0 1 3-3h11"/><path d="M9 7h6M9 10h4"/></svg>
      Libreta
    </div>
    <div class="search-wrap">
      <span class="icon">⌕</span>
      <input id="search" type="search" placeholder="Buscar en todos los cuadernos  (Ctrl+K)" autocomplete="off">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="top-actions">
      <button class="top-btn" id="btn-backup" title="Exportar, respaldar y restaurar">⤓ Respaldo</button>
      <button class="top-btn" id="btn-antigravity" title="Conectar con Antigravity">⚡ Antigravity</button>
      <button class="top-btn" id="btn-theme" title="Cambiar tema">◐</button>
    </div>
  </header>

  <div class="main">
    <aside class="col-notebooks">
      <div class="col-head">Cuadernos <button class="add-btn" id="add-notebook">+ Cuaderno</button></div>
      <div class="col-body" id="notebooks"></div>
    </aside>
    <aside class="col-pages">
      <div class="col-head"><span id="pages-title">Páginas</span> <button class="add-btn" id="add-page">+ Página</button></div>
      <div class="col-body" id="pages"></div>
    </aside>
    <main class="col-editor" id="editor-col">
      <div class="editor" id="editor"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
